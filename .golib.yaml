schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["."]
        run: 'Concurrent|Cancellation|Panic|Reenter|StateMachine|Permit'
        count: 20
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzMetadataAndAttempts$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBudgetStateMachine$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPolicyStackOrderAndEventHistory$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTypedErrorsAndClockedEvents$'
        budget: 1000x
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
