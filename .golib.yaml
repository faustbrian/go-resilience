schema_version: 1
tool_version: v1.0.13
tool_checksums_sha256: 164e5c8abefe655958f522677856816faddbd2a8d40eba7d37ba5a031210df70

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["."]
        run: 'Concurrent|Cancellation|Panic|Reenter|StateMachine|Permit'
        count: 20
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzMetadataAndAttempts$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBudgetStateMachine$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPolicyStackOrderAndEventHistory$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTypedErrorsAndClockedEvents$'
        budget: 1000x
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
