schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt

operations:
  # Bound concurrent admission, callback reentry and permit/scope cleanup.
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^Test(BudgetConcurrentAdmissionNeverExceedsConfiguredCapacity|ObserverCanReenterExecutorWithoutDeadlock|ClosingScopeDefersReleaseUntilActivePermitCompletes|OperationPanicReleasesBudgetAndPreservesPanic)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["."]
        run: 'Concurrent|Cancellation|Panic|Reenter|StateMachine|Permit'
        count: 20
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzMetadataAndAttempts$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBudgetStateMachine$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPolicyStackOrderAndEventHistory$'
        budget: 1000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTypedErrorsAndClockedEvents$'
        budget: 1000x
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
